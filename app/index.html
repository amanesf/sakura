<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <title>終わりを知らない、あの夏の境界線</title>
  </head>
  <body>
    <!-- The page's own light. `.ambience` is the graded field the picture sits
         in, plus the glow it spills backwards into that field. It is a sibling
         of the content rather than a background on <body> so measurement mode
         (?fit=frame) can switch the whole thing off in one rule.

         Deliberately *behind* the picture and never over it: the illustration
         is composited last by effects/plateShader.ts and the cloud colours are
         measured off the reference, so a decorative grade laid over the frame
         would tint the painted girl and window and move every statistic the
         measure loop depends on. -->
    <div class="ambience" aria-hidden="true"></div>

    <header class="title">
      <h1 class="title__main">終わりを知らない、あの夏の境界線</h1>
      <div class="title__rule" aria-hidden="true"></div>
      <p class="title__sub">The Boundary of That Endless Summer</p>
    </header>

    <div class="stage">
      <div id="app"></div>
    </div>

    <footer class="console"></footer>

    <!-- The same sky as a flat line drawing (ui/outlinePanel.ts). Fills the
         lower half of the page, which was deliberate darkness and is now the
         diagrammatic half of a two-reading composition. -->
    <section class="outline" aria-hidden="true"></section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
