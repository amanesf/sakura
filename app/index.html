<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <title>終わりを知らない、あの夏の境界線</title>
  </head>
  <body>

    <!-- The canvas covers the whole page and sits behind everything, so the
         picture and the silhouette under it are drawn in one frame by the GPU
         with nothing read back (core/compose.ts). `.stage` below is now only a
         spacer: it reserves the band and tells the compose pass where to put
         the picture. -->
    <div id="app" aria-hidden="true"></div>

    <header class="title">
      <h1 class="title__main">終わりを知らない、あの夏の境界線</h1>
      <div class="title__rule" aria-hidden="true"></div>
      <p class="title__sub">The Boundary of That Endless Summer</p>
    </header>

    <div class="stage"></div>

    <footer class="console"></footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
